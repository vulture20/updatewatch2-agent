name: Release

# Tag-triggered, mirroring updatewatch2-server's docker-publish.yml
# (push to a "v*.*.*" tag). workflow_dispatch runs the same build+package
# pipeline without publishing anything — useful to validate the installer
# scripts before actually cutting a tag; the `release` job below only runs
# for a real tag push (see its `if:`).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # DnfIntegration-tagged tests need a real dnf/yum host (see
      # scripts/run-fedora-test-server.sh's own dnf-integration-test job in
      # ci.yml) — this job's plain ubuntu-latest runner has neither, same
      # reason ci.yml's own `test` job excludes them. Missed here originally
      # (agent v1.0.33's own tag push failed this job for exactly that
      # reason, with no release artifacts published as a result) since this
      # is a second, separate `dotnet test` call site from ci.yml's.
      - run: dotnet test --filter "Category!=DnfIntegration"

  # Cross-published from Linux — makensis runs fine on Linux, and
  # `dotnet publish -r <RID>` needs no Windows host, so this avoids a
  # (slower, pricier) windows-latest runner entirely, for either
  # architecture. Builds win-x64 and win-arm64 (updatewatch2-agent#23 —
  # raised after a direct user question, "Wäre auch ein arm64-Release
  # denkbar?") sequentially in one job rather than a matrix, deliberately:
  # `dotnet publish -r win-arm64` is a pure cross-compile flag exactly like
  # the existing win-x64 one, so there's no meaningful parallelism to gain,
  # and a single job lets both installers share one "windows-installer"
  # artifact (the existing UpdateWatch2Agent-Setup-*.exe glob already
  # matches both filenames once ARCH is embedded in each) without touching
  # the release job's download step at all. setup.nsi's own runtime logic
  # (SetRegView 64/$PROGRAMFILES64/x64.nsh) needs no ARM64-specific
  # handling — see that script's own header comment for why: the
  # installer stub stays a plain 32-bit NSIS executable for both
  # architectures, relying on Windows-on-ARM's x86 emulation layer the
  # same way it already relies on x64 Windows' own WOW64 registry
  # redirection; only the bundled PAYLOAD (UpdateWatch2.Agent.exe) needs
  # to actually be win-arm64-native, which is purely what `dotnet publish
  # -r win-arm64` below produces. **Not live-verified against a real
  # Windows-on-ARM device** — no such host has ever been available to this
  # project; same standing caveat as every other Windows-specific claim in
  # this codebase (CLAUDE.md).
  windows-installer:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/UpdateWatch2.Agent -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Build x64 installer
        working-directory: installer/nsis
        run: makensis -DVERSION=${{ steps.version.outputs.value }} -DARCH=x64 setup.nsi

      - name: Publish self-contained win-arm64
        run: >
          dotnet publish src/UpdateWatch2.Agent -c Release -r win-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-arm64

      - name: Build arm64 installer
        working-directory: installer/nsis
        run: makensis -DVERSION=${{ steps.version.outputs.value }} -DARCH=arm64 setup.nsi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: installer/nsis/UpdateWatch2Agent-Setup-*.exe
          if-no-files-found: error

  # "optional" per CLAUDE.md's own framing of the Linux agent (planned as a
  # later addition, behind Windows) — continue-on-error so a Linux
  # packaging problem never blocks the Windows release the way a failure
  # in the windows-installer job (no continue-on-error there) does; applies
  # per matrix leg below too, so an arm64-specific problem can't block the
  # amd64 packages either.
  #
  # arm64 packages (updatewatch2-agent#22 — raised after a direct user
  # question, "Wäre auch ein arm64-Release denkbar?") run on a native,
  # GitHub-hosted ubuntu-24.04-arm runner (free for this public repo)
  # rather than under QEMU emulation — the same "native beats emulation for
  # a .NET SDK build" reasoning updatewatch2-server#23's Docker multi-arch
  # image already established, and it's what makes the smoke test below
  # meaningful: both matrix legs execute the actual published binary
  # natively, not emulated, so a "does it even start" check is a genuine
  # answer for that architecture, not just for the runner's own. matrix.deb_arch
  # is passed to fpm as-is for BOTH .deb and .rpm output — confirmed by
  # hand in this session, not assumed: fpm already auto-translates "amd64"
  # to the RPM convention "x86_64" (silently relied on by this job even
  # before this change, since the original single-architecture loop passed
  # "amd64" uniformly to both package types), and does the identical
  # translation for "arm64" -> "aarch64", verified directly against a
  # throwaway test package before trusting it here.
  linux-packages:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64
            runner: ubuntu-latest
          - rid: linux-arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained ${{ matrix.rid }}
        run: >
          dotnet publish src/UpdateWatch2.Agent -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Stage package contents
        run: |
          mkdir -p staging/opt/updatewatch2-agent
          cp publish/${{ matrix.rid }}/UpdateWatch2.Agent staging/opt/updatewatch2-agent/
          chmod 755 staging/opt/updatewatch2-agent/UpdateWatch2.Agent

      # Runs the actual staged binary that's about to be packaged below —
      # genuine extra verification the amd64 path has never had either
      # (CLAUDE.md already discloses the whole Linux install path as
      # "not live-verified" beyond a throwaway apt-search harness), not
      # just an arm64-specific check. A fresh GitHub Actions runner has no
      # /etc/updatewatch2/agent.conf, so this runs exactly like a genuinely
      # fresh, unconfigured install: LinuxFileConfigStore.Load() falls back
      # to AgentOptions' own defaults (empty ServerAddress), RegistrationWorker
      # can't reach a server and logs "Registration attempt failed" on its
      # own retry loop (Program.cs only sets HttpClient.BaseAddress when
      # ServerAddress is non-blank) — confirming the binary actually
      # started, initialized DI, and is running real code, not just that
      # the process launched. Never run this against a real host's own
      # /etc/updatewatch2 by hand — LinuxFileConfigStore's path is a fixed,
      # unoverridable absolute path with no test/sandbox switch, so doing
      # this outside a disposable CI runner risks colliding with a real,
      # already-registered agent's own config/certificate.
      - name: Smoke test the published binary
        working-directory: staging/opt/updatewatch2-agent
        run: |
          set -e
          ./UpdateWatch2.Agent > /tmp/smoke-test.log 2>&1 &
          agent_pid=$!

          sleep 8
          if ! kill -0 "$agent_pid" 2>/dev/null; then
            echo "FAILED: agent process exited within 8s of starting — expected it to still be running its retry loop."
            cat /tmp/smoke-test.log
            exit 1
          fi

          kill -TERM "$agent_pid"
          for _ in $(seq 1 10); do
            kill -0 "$agent_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$agent_pid" 2>/dev/null; then
            echo "FAILED: agent process did not exit within 10s of SIGTERM."
            cat /tmp/smoke-test.log
            exit 1
          fi

          echo "--- smoke test log ---"
          cat /tmp/smoke-test.log
          if ! grep -q "Registration attempt failed" /tmp/smoke-test.log; then
            echo "FAILED: expected log line 'Registration attempt failed' not found — binary may not have run real startup code."
            exit 1
          fi
          echo "Smoke test passed: process started, ran real startup/registration code, logged the expected no-server-configured failure, and shut down cleanly on SIGTERM."

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm build-essential
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm
        run: |
          mkdir -p dist
          for pkg_type in deb rpm; do
            fpm -s dir -t "$pkg_type" \
              -n updatewatch2-agent \
              -v "${{ steps.version.outputs.value }}" \
              --license AGPL-3.0-or-later \
              --vendor "Thorsten Schröpel" \
              --maintainer "Thorsten Schröpel" \
              --description "UpdateWatch2 Agent - centrally managed Windows/Linux update agent" \
              --url "https://github.com/${{ github.repository }}" \
              --architecture ${{ matrix.deb_arch }} \
              --after-install installer/linux/postinst.sh \
              --before-remove installer/linux/prerm.sh \
              --after-remove installer/linux/postrm.sh \
              $([ "$pkg_type" = deb ] && echo --deb-no-default-config-files) \
              -p dist/ \
              staging/opt/updatewatch2-agent/=/opt/updatewatch2-agent/ \
              installer/linux/updatewatch2-agent.service=/lib/systemd/system/updatewatch2-agent.service
          done

      # Two separate artifacts per architecture, not one "linux-packages"
      # artifact holding all four files — a multi-file GitHub Actions
      # artifact always downloads as a single zip from the run's UI, which
      # would bundle everything together there even though the final
      # Release step below already attaches each as its own asset
      # regardless (softprops/action-gh-release's `files:` uploads every
      # matched file individually, never as an archive). Named by
      # matrix.deb_arch (not matrix.rid) since that's the value both
      # resulting filenames actually embed (updatewatch2-agent_<version>_arm64.deb,
      # updatewatch2-agent-<version>-1.aarch64.rpm).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm-${{ matrix.deb_arch }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    needs: [windows-installer, linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: dist

      # linux-packages runs with continue-on-error: true, per matrix leg —
      # any one of these four artifacts may legitimately not exist if that
      # specific leg failed, so none of these downloads may fail the
      # release over it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: linux-deb-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: linux-rpm-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: linux-deb-arm64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: linux-rpm-arm64
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
